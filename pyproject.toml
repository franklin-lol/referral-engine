[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-engine"
version = "0.1.0"
description = "Pluggable, async-native multi-level referral distribution engine for Python services"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Franklin", email = "fxranxklin@proton.me"}
]
keywords = [
    "referral", "mlm", "affiliate", "distribution", "async",
    "telegram", "ton", "crypto", "fastapi", "postgresql"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://referralos.vercel.app"
Repository = "https://github.com/franklin-lol/referral-engine"
Documentation = "https://github.com/franklin-lol/referral-engine#readme"
"Bug Tracker" = "https://github.com/franklin-lol/referral-engine/issues"

[tool.setuptools]
packages = ["referral_engine", "referral_engine.adapters"]

[project.optional-dependencies]
db = [
    "asyncpg>=0.29.0",
    "pyyaml>=6.0.1",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic-settings>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]